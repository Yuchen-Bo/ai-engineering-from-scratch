<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="fig-7-1-title fig-7-1-desc" font-family="JetBrains Mono, ui-monospace, monospace">
  <title id="fig-7-1-title">Start from the symptom, check one number, then go to one page</title>
  <desc id="fig-7-1-desc">Five symptoms, each with the first number or log line to check and the page that fixes it: a failed start, a slow first token, a stuttering stream, low output, and wrong output.</desc>
  <defs><marker id="fig-7-1-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker></defs>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">WHAT YOU SEE</text>
  <text x="200" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">CHECK FIRST</text>
  <text x="430" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">THEN READ</text>
  <rect x="20" y="30" width="160" height="40" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="100" y="53.75" font-size="12.5" text-anchor="middle" font-weight="700">start fails</text>
  <line x1="180" y1="50" x2="199" y2="50" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-1-head-ink)"/>
  <text x="204" y="55" font-size="11.5" class="m-serif">last line of the start log</text>
  <text x="430" y="55" font-size="11.5" fill="var(--m-blue-ink, #2f5d9a)">2.2 out of memory at start</text>
  <rect x="20" y="82" width="160" height="40" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="100" y="105.75" font-size="12.5" text-anchor="middle" font-weight="700">first token slow</text>
  <line x1="180" y1="102" x2="199" y2="102" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-1-head-ink)"/>
  <text x="204" y="107" font-size="11.5" class="m-serif">prefix cache hit rate, queue</text>
  <text x="430" y="107" font-size="11.5" fill="var(--m-blue-ink, #2f5d9a)">3.2 the prefix cache</text>
  <rect x="20" y="134" width="160" height="40" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="100" y="157.75" font-size="12.5" text-anchor="middle" font-weight="700">stream stutters</text>
  <line x1="180" y1="154" x2="199" y2="154" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-1-head-ink)"/>
  <text x="204" y="159" font-size="11.5" class="m-serif">P99 ITL against users</text>
  <text x="430" y="159" font-size="11.5" fill="var(--m-blue-ink, #2f5d9a)">3.3 long prompts</text>
  <rect x="20" y="186" width="160" height="40" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="100" y="209.75" font-size="12.5" text-anchor="middle" font-weight="700">output too low</text>
  <line x1="180" y1="206" x2="199" y2="206" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-1-head-ink)"/>
  <text x="204" y="211" font-size="11.5" class="m-serif">preemptions, KV usage</text>
  <text x="430" y="211" font-size="11.5" fill="var(--m-blue-ink, #2f5d9a)">3.1 chat for many users</text>
  <rect x="20" y="238" width="160" height="40" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)"/>
  <text x="100" y="261.75" font-size="12.5" text-anchor="middle" font-weight="700">output wrong</text>
  <line x1="180" y1="258" x2="199" y2="258" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-7-1-head-ink)"/>
  <text x="204" y="263" font-size="11.5" class="m-serif">cache, spec decoding, seed</text>
  <text x="430" y="263" font-size="11.5" fill="var(--m-blue-ink, #2f5d9a)">3.8 reproducible outputs</text>
</svg>
